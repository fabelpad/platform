name: Fabelpad dg-vps-08 production kandidaat bouwen
run-name: Fabelpad production kandidaat ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Volledige goedgekeurde SHA op main (40 kleine hextekens)
        type: string
        required: true
      config_id:
        description: Nieuwe configuratie-ID voor het onveranderlijke snapshot van de vier publieke waarden
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: fabelpad-vps08-production-candidate
  cancel-in-progress: false

jobs:
  preflight:
    environment: production
    if: >-
      github.repository == 'fabelpad/platform' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'fabelpad/platform/.github/workflows/fabelpad-dg-vps-08-production-candidate.yml@refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Controleer configuratie-ID, exacte SHA en vereiste CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          CONFIG_ID: ${{ inputs.config_id }}
          FABELPAD_APP_ORIGIN: ${{ vars.FABELPAD_APP_ORIGIN }}
          FABELPAD_DATA_MODE: ${{ vars.FABELPAD_DATA_MODE }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONFIG_ID" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]] || exit 64
          node scripts/deploy/verify-release-sha.mjs --sha "$RELEASE_SHA"
          node --input-type=module -e '
            import {validatePublicConfig} from "./scripts/deploy/release-contract.mjs";
            validatePublicConfig(Object.fromEntries(["FABELPAD_APP_ORIGIN","FABELPAD_DATA_MODE","NEXT_PUBLIC_SUPABASE_URL","NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"].map(name=>[name,process.env[name]??""])));
            console.log("De vier publieke buildvariabelen zijn geldig; waarden worden niet getoond.");'

  candidate:
    environment: production
    needs: preflight
    if: github.repository == 'fabelpad/platform' && github.ref == 'refs/heads/main'
    # Dedicated repository runner; root-owned adapter repeats main/SHA/CI checks.
    runs-on: [self-hosted, Linux, X64, dg-vps-08, fabelpad-vps08-production]
    timeout-minutes: 50
    steps:
      - name: Controleer host en afzonderlijk runneraccount
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(hostname)" == dg-vps-08 ]]
          [[ "$(id -un)" == run-fab-v08-prd ]]
          [[ "$(uname -m)" == x86_64 ]]
          [[ "$(cat /etc/machine-id)" == 05db94b99eca4c3d815f6585ef8ed517 ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Hercontroleer CI en bouw uitsluitend een nieuwe kandidaat
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          CONFIG_ID: ${{ inputs.config_id }}
          FABELPAD_APP_ORIGIN: ${{ vars.FABELPAD_APP_ORIGIN }}
          FABELPAD_DATA_MODE: ${{ vars.FABELPAD_DATA_MODE }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONFIG_ID" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]] || exit 64
          task_ci="$(/opt/dg-toolchains/fabelpad-vps08-production/node-v24.18.0-linux-x64/bin/node scripts/deploy/verify-release-sha.mjs --sha "$RELEASE_SHA")"
          CI_TICKET="$task_ci" /opt/dg-toolchains/fabelpad-vps08-production/node-v24.18.0-linux-x64/bin/node --input-type=module -e '
            import {spawnSync} from "node:child_process";
            const ci = JSON.parse(process.env.CI_TICKET);
            const result = spawnSync("sudo", ["-n", "/usr/local/libexec/fabelpad-vps08-production/candidate-build.sh",
              "--sha", process.env.RELEASE_SHA, "--config-id", process.env.CONFIG_ID,
              "--run-id", process.env.GITHUB_RUN_ID, "--run-attempt", process.env.GITHUB_RUN_ATTEMPT,
              "--ci-run-id", String(ci.ciRunId), "--ci-run-attempt", String(ci.ciRunAttempt), "--ci-job-id", String(ci.ciJobId)],
              {input:JSON.stringify({githubToken:process.env.GH_TOKEN, publicConfig:Object.fromEntries(["FABELPAD_APP_ORIGIN","FABELPAD_DATA_MODE","NEXT_PUBLIC_SUPABASE_URL","NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"].map(name=>[name,process.env[name]??""]))}), env:{PATH:"/usr/sbin:/usr/bin:/sbin:/bin"}, stdio:["pipe","inherit","inherit"]});
            process.exit(result.status ?? 1);'
          printf 'Kandidaat-ID: %s-%s-%s\n' "$RELEASE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

# No runtime secrets, migration, current switch, service start or
# proxy change belongs to this build route. The installed root-owned dispatcher
# repeats GitHub ancestry/CI verification and scrubs the build worker environment.
