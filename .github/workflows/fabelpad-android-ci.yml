name: Fabelpad Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      signed_bundle:
        description: Bouw een gesigneerde productie-AAB zonder Play-upload
        type: boolean
        default: false

permissions:
  contents: read

env:
  CI: '1'
  FABELPAD_ANDROID_PACKAGE: 'nl.fabelpad.app'
  FABELPAD_PRIVACY_URL: 'https://fabelpad.nl/privacy'
  FABELPAD_SUPPORT_URL: 'mailto:support@fabelpad.nl'
  FABELPAD_ANDROID_ICON: './assets/brand/launcher.png'

jobs:
  verify:
    name: Native Android-controles
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      native_changed: ${{ steps.native_scope.outputs.changed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Controleer alle native buildinputs van deze main-push
        id: native_scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/play/native_scope.py \
            --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" \
            --repository "$GITHUB_REPOSITORY" --before "$BEFORE_SHA" \
            --sha "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Maak ruimte op de tijdelijke GitHub-runner
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf -- /usr/share/dotnet /opt/ghc
      - name: Installeer vastgelegde dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          npm ci --prefix mobile --no-audit --no-fund
      - name: Test Play-planning en exacte CI-vrijgave zonder credentials
        run: python3 -B -m unittest discover -s scripts/play -p 'test_*.py'
      - name: Controleer TypeScript en native gedrag
        run: |
          npm run check --prefix mobile
          npm run check:native
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        id: java17
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Lokaliseer Android SDK en verifieer de command-line tools
        run: |
          set -euo pipefail
          sdk_root=''
          sdk_manager=''
          for candidate in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk; do
            if [[ -n "$candidate" && -x "$candidate/cmdline-tools/latest/bin/sdkmanager" && -r "$candidate/cmdline-tools/latest/source.properties" ]]; then
              sdk_root="$candidate"
              sdk_manager="$candidate/cmdline-tools/latest/bin/sdkmanager"
              break
            fi
          done
          if [[ -z "$sdk_manager" ]]; then
            sdk_root="$RUNNER_TEMP/fabelpad-android-sdk"
            tools_version=15859902
            tools_sha256=4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
            tools_archive="$RUNNER_TEMP/fabelpad-commandline-tools-$tools_version.zip"
            tools_unpack="$RUNNER_TEMP/fabelpad-commandline-tools-unpack"
            curl --fail --silent --show-error --location --retry 3 \
              "https://dl.google.com/android/repository/commandlinetools-linux-${tools_version}_latest.zip" \
              --output "$tools_archive"
            printf '%s  %s\n' "$tools_sha256" "$tools_archive" | sha256sum --check -
            mkdir -p "$tools_unpack" "$sdk_root/cmdline-tools"
            unzip -q "$tools_archive" -d "$tools_unpack"
            mv "$tools_unpack/cmdline-tools" "$sdk_root/cmdline-tools/$tools_version"
            sdk_manager="$sdk_root/cmdline-tools/$tools_version/bin/sdkmanager"
          fi
          export ANDROID_HOME="$sdk_root" ANDROID_SDK_ROOT="$sdk_root"
          PATH="$(dirname "$sdk_manager"):$sdk_root/platform-tools:$PATH"
          export PATH
          "$sdk_manager" --version
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\nFABELPAD_SDKMANAGER=%s\n' \
            "$sdk_root" "$sdk_root" "$sdk_manager" >> "$GITHUB_ENV"
          printf '%s\n' "$(dirname "$sdk_manager")" "$sdk_root/platform-tools" >> "$GITHUB_PATH"
      - name: Installeer Android-toolchain uit de gelockte React Native-versie
        run: |
          set -euo pipefail
          versions=mobile/node_modules/react-native/gradle/libs.versions.toml
          sdk_version() { sed -n "s/^$1 = \"\([^\"]*\)\"/\1/p" "$versions"; }
          compile_sdk="$(sdk_version compileSdk)"
          build_tools="$(sdk_version buildTools)"
          ndk="$(sdk_version ndkVersion)"
          test -n "$compile_sdk" && test -n "$build_tools" && test -n "$ndk"
          "$FABELPAD_SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses < <(printf 'y\n%.0s' {1..100}) > "$RUNNER_TEMP/fabelpad-android-licenses.log"
          "$FABELPAD_SDKMANAGER" --sdk_root="$ANDROID_HOME" --list > "$RUNNER_TEMP/fabelpad-android-packages.txt"
          platform="$(awk -F'|' -v exact="platforms;android-$compile_sdk" -v dotted="platforms;android-$compile_sdk.0" '
            { package=$1; gsub(/^[[:space:]]+|[[:space:]]+$/, "", package) }
            package == exact { found_exact=package }
            package == dotted { found_dotted=package }
            END { if (found_exact) print found_exact; else if (found_dotted) print found_dotted }
          ' "$RUNNER_TEMP/fabelpad-android-packages.txt")"
          : "${platform:?Gelockt Android-platform ontbreekt in de SDK-catalogus}"
          "$FABELPAD_SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "$platform" "platform-tools" "build-tools;$build_tools" "ndk;$ndk" 'cmake;3.22.1'
      - name: Bouw de native release zonder uploadsleutel
        env:
          FABELPAD_UNSIGNED_CHECK: 'true'
          FABELPAD_ANDROID_VERSION_CODE: '1'
          FABELPAD_AUDIO_ENVIRONMENT: staging
          FABELPAD_AUDIO_ORIGIN: https://staging.fabelpad.nl
          FABELPAD_NARRATION_FIXTURE: 'true'
          FABELPAD_PRIVACY_URL: https://staging.fabelpad.nl/privacy
          JAVA_TOOLCHAIN_17: ${{ steps.java17.outputs.path }}
        run: |
          set -euo pipefail
          FABELPAD_ANDROID_VERSION_NAME="$(node -p "require('./mobile/package.json').version")"
          export FABELPAD_ANDROID_VERSION_NAME
          FABELPAD_VARIANT=production bash scripts/native-build-production.sh --unsigned-check
          # Compile-only connected staging build. This deliberately synthetic
          # public key cannot authenticate or contact a payment provider.
          FABELPAD_VARIANT=connected \
            FABELPAD_ANDROID_VERSION_CODE=3 \
            FABELPAD_CONNECTED_ENVIRONMENT=staging \
            FABELPAD_CONNECTED_ORIGIN=https://staging.fabelpad.nl \
            FABELPAD_CONNECTED_SUPABASE_URL=https://tlwfpivafcokcjyjwgmq.supabase.co \
            FABELPAD_CONNECTED_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_build_validation_only \
            bash scripts/native-build-production.sh --unsigned-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fabelpad-android-check-${{ github.sha }}
          path: |
            artifacts/native/fabelpad-production-unsigned.aab
            artifacts/native/fabelpad-production-unsigned.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fabelpad-android-connected-check-${{ github.sha }}
          path: |
            artifacts/native/fabelpad-production-connected-unsigned.aab
            artifacts/native/fabelpad-production-connected-unsigned.json
          retention-days: 14
          if-no-files-found: error

  parent_ux:
    name: Android-ouderomgeving op emulator
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: fabelpad-android-check-${{ github.sha }}
          path: ${{ runner.temp }}/fabelpad-parent-ux/aab
      - name: Maak een uitsluitend voor de emulator gesigneerde APK uit dezelfde AAB
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf -- /usr/share/dotnet /opt/ghc
          task_root="$RUNNER_TEMP/fabelpad-parent-ux"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$task_root/bundletool.jar"
          printf '%s  %s\n' a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29 "$task_root/bundletool.jar" | sha256sum --check -
          # This generated test identity has no relationship to Play upload signing.
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$task_root/emulator-only.p12" \
            -alias fabelpad-emulator -storepass android -keypass android \
            -dname 'CN=Fabelpad Emulator Test Only' -keyalg RSA -keysize 2048 -validity 2
          java -jar "$task_root/bundletool.jar" build-apks \
            --bundle="$task_root/aab/fabelpad-production-unsigned.aab" --output="$task_root/emulator.apks" \
            --mode=universal --ks="$task_root/emulator-only.p12" --ks-key-alias=fabelpad-emulator \
            --ks-pass=pass:android --key-pass=pass:android
          unzip -p "$task_root/emulator.apks" universal.apk > "$task_root/emulator.apk"
      - name: Installeer een geïsoleerde Android-emulator
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK ontbreekt op de GitHub-runner}"
          sdk_manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdk_manager"
          "$sdk_manager" --licenses < <(printf 'y\n%.0s' {1..100}) > "$RUNNER_TEMP/fabelpad-parent-ux/licenses.log"
          "$sdk_manager" 'emulator' 'platform-tools' 'system-images;android-35;google_apis;x86_64'
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
          export ANDROID_AVD_HOME="$RUNNER_TEMP/fabelpad-parent-ux/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --name fabelpad_parent_ux --package 'system-images;android-35;google_apis;x86_64' --device pixel_5
          printf 'hw.lcd.width=1080\nhw.lcd.height=1920\nhw.lcd.density=480\nhw.keyboard=no\n' \
            >> "$ANDROID_AVD_HOME/fabelpad_parent_ux.avd/config.ini"
      - name: Controleer de echte ouderinterface, offline opslag en ouderpoort
        timeout-minutes: 22
        shell: bash
        run: |
          set -euo pipefail
          task_root="$RUNNER_TEMP/fabelpad-parent-ux"
          export ANDROID_AVD_HOME="$task_root/avd"
          adb="$ANDROID_HOME/platform-tools/adb"
          mkdir -p "$task_root/evidence"
          "$ANDROID_HOME/emulator/emulator" -avd fabelpad_parent_ux -port 5554 \
            -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader \
            -memory 2048 -cores 2 -no-metrics > "$task_root/evidence/emulator.log" 2>&1 &
          emulator_pid=$!
          trap '"$adb" -s emulator-5554 emu kill >/dev/null 2>&1 || kill "$emulator_pid" 2>/dev/null || true' EXIT
          booted=false
          for attempt in {1..90}; do
            if [[ "$("$adb" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]]; then
              booted=true
              break
            fi
            kill -0 "$emulator_pid"
            sleep 2
          done
          test "$booted" = true
          "$adb" -s emulator-5554 shell input keyevent KEYCODE_WAKEUP
          "$adb" -s emulator-5554 shell wm dismiss-keyguard
          python3 -B scripts/native-ux-smoke.py --adb "$adb" --serial emulator-5554 \
            --apk "$task_root/emulator.apk" --output "$task_root/evidence" --reset-test-data --narration-fixture --max-seconds 1050
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: fabelpad-android-parent-ux-${{ github.sha }}
          path: ${{ runner.temp }}/fabelpad-parent-ux/evidence
          retention-days: 14
          if-no-files-found: warn

  play_config:
    name: Controleer vastgelegde Play-configuratie
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      signing_enabled: ${{ steps.config.outputs.signing_enabled }}
      play_enabled: ${{ steps.config.outputs.play_enabled }}
      connection_check_enabled: ${{ steps.config.outputs.connection_check_enabled }}
      version_code_base: ${{ steps.config.outputs.version_code_base }}
      internal_tracks: ${{ steps.config.outputs.internal_tracks }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Valideer niet-geheime release-instellingen zonder Google-toegang
        id: config
        run: python3 -B scripts/play/read_config.py --config scripts/play/config.json --github-output "$GITHUB_OUTPUT"

  connection:
    name: Controleer interne Google Play-verbinding zonder wijzigingen
    needs: play_config
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'fabelpad/platform' && needs.play_config.outputs.connection_check_enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: fabelpad-play-internal
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Autoriseer tijdelijk voor de alleen-lezen verbindingscontrole
        id: play-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.PLAY_WIF_PROVIDER }}
          service_account: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher,https://www.googleapis.com/auth/userinfo.email
          create_credentials_file: false
          export_environment_variables: false
      - name: Controleer doelidentiteit en app-toegang zonder een Play-edit
        id: connection
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.play-auth.outputs.access_token }}
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
        run: |
          python3 -B scripts/play/probe_connection.py \
            --project fabelpad --project-number 471984799009 --environment internal \
            --service-account "$PLAY_SERVICE_ACCOUNT" \
            --output "$RUNNER_TEMP/fabelpad-play-connection.json" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fabelpad-play-internal-connection
          path: ${{ runner.temp }}/fabelpad-play-connection.json
          retention-days: 30
          if-no-files-found: error

  signed:
    name: Productie-AAB signeren en eventueel intern uploaden
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'push' && needs.verify.outputs.native_changed == 'true' && needs.play_config.outputs.play_enabled == 'true') || (github.event_name == 'workflow_dispatch' && inputs.signed_bundle && needs.play_config.outputs.signing_enabled == 'true'))
    needs: [verify, play_config]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: fabelpad-play-internal
    concurrency:
      group: fabelpad-play-release
      queue: max
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      VERSION_CODE_BASE: ${{ needs.play_config.outputs.version_code_base }}
      INTERNAL_TRACKS: ${{ needs.play_config.outputs.internal_tracks }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Vereis originele geslaagde project-CI op deze SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/play/verify_ci.py --workflow verify.yml --sha "$GITHUB_SHA" --wait-seconds 1500
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Bepaal de vaste release-identiteit
        id: version
        run: |
          set -euo pipefail
          test "$FABELPAD_ANDROID_PACKAGE" = nl.fabelpad.app
          [[ "$VERSION_CODE_BASE" =~ ^[1-9][0-9]{0,9}$ ]]
          version_name="$(node -p "require('./mobile/package.json').version")"
          [[ "$version_name" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version_code=$((VERSION_CODE_BASE + GITHUB_RUN_NUMBER))
          ((version_code >= 1 && version_code <= 2100000000))
          printf 'code=%s\nname=%s\n' "$version_code" "$version_name" >> "$GITHUB_OUTPUT"
      - name: Herstel exact dezelfde AAB bij een herstart van deze run
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=fabelpad-signed-aab")"
          artifact_id="$(jq -er '[.artifacts[] | select(.name == "fabelpad-signed-aab" and .expired == false)] | if length == 0 then "" elif length == 1 then .[0].id else error("Meerdere bundels voor dezelfde run") end' <<< "$artifacts")"
          if [[ -z "$artifact_id" ]]; then
            echo 'found=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/fabelpad-signed-aab.zip"
          mkdir -p artifacts/native
          unzip -p "$RUNNER_TEMP/fabelpad-signed-aab.zip" fabelpad-production.aab > artifacts/native/fabelpad-production.aab
          unzip -p "$RUNNER_TEMP/fabelpad-signed-aab.zip" fabelpad-production.json > artifacts/native/fabelpad-production.json
          unzip -p "$RUNNER_TEMP/fabelpad-signed-aab.zip" fabelpad-production-mapping.txt > artifacts/native/fabelpad-production-mapping.txt
          echo 'found=true' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        id: java17
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Lokaliseer Android SDK en verifieer de command-line tools
        if: steps.existing.outputs.found == 'false'
        run: |
          set -euo pipefail
          sdk_root=''
          sdk_manager=''
          for candidate in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk; do
            if [[ -n "$candidate" && -x "$candidate/cmdline-tools/latest/bin/sdkmanager" && -r "$candidate/cmdline-tools/latest/source.properties" ]]; then
              sdk_root="$candidate"
              sdk_manager="$candidate/cmdline-tools/latest/bin/sdkmanager"
              break
            fi
          done
          if [[ -z "$sdk_manager" ]]; then
            sdk_root="$RUNNER_TEMP/fabelpad-android-sdk"
            tools_version=15859902
            tools_sha256=4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
            tools_archive="$RUNNER_TEMP/fabelpad-commandline-tools-$tools_version.zip"
            tools_unpack="$RUNNER_TEMP/fabelpad-commandline-tools-unpack"
            curl --fail --silent --show-error --location --retry 3 \
              "https://dl.google.com/android/repository/commandlinetools-linux-${tools_version}_latest.zip" \
              --output "$tools_archive"
            printf '%s  %s\n' "$tools_sha256" "$tools_archive" | sha256sum --check -
            mkdir -p "$tools_unpack" "$sdk_root/cmdline-tools"
            unzip -q "$tools_archive" -d "$tools_unpack"
            mv "$tools_unpack/cmdline-tools" "$sdk_root/cmdline-tools/$tools_version"
            sdk_manager="$sdk_root/cmdline-tools/$tools_version/bin/sdkmanager"
          fi
          export ANDROID_HOME="$sdk_root" ANDROID_SDK_ROOT="$sdk_root"
          PATH="$(dirname "$sdk_manager"):$sdk_root/platform-tools:$PATH"
          export PATH
          "$sdk_manager" --version
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\nFABELPAD_SDKMANAGER=%s\n' \
            "$sdk_root" "$sdk_root" "$sdk_manager" >> "$GITHUB_ENV"
          printf '%s\n' "$(dirname "$sdk_manager")" "$sdk_root/platform-tools" >> "$GITHUB_PATH"
      - name: Installeer dependencies en Android-toolchain
        if: steps.existing.outputs.found == 'false'
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf -- /usr/share/dotnet /opt/ghc
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          npm ci --prefix mobile --no-audit --no-fund
          versions=mobile/node_modules/react-native/gradle/libs.versions.toml
          sdk_version() { sed -n "s/^$1 = \"\([^\"]*\)\"/\1/p" "$versions"; }
          compile_sdk="$(sdk_version compileSdk)"
          build_tools="$(sdk_version buildTools)"
          ndk="$(sdk_version ndkVersion)"
          test -n "$compile_sdk" && test -n "$build_tools" && test -n "$ndk"
          "$FABELPAD_SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses < <(printf 'y\n%.0s' {1..100}) > "$RUNNER_TEMP/fabelpad-android-licenses.log"
          "$FABELPAD_SDKMANAGER" --sdk_root="$ANDROID_HOME" --list > "$RUNNER_TEMP/fabelpad-android-packages.txt"
          platform="$(awk -F'|' -v exact="platforms;android-$compile_sdk" -v dotted="platforms;android-$compile_sdk.0" '
            { package=$1; gsub(/^[[:space:]]+|[[:space:]]+$/, "", package) }
            package == exact { found_exact=package }
            package == dotted { found_dotted=package }
            END { if (found_exact) print found_exact; else if (found_dotted) print found_dotted }
          ' "$RUNNER_TEMP/fabelpad-android-packages.txt")"
          : "${platform:?Gelockt Android-platform ontbreekt in de SDK-catalogus}"
          "$FABELPAD_SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "$platform" "platform-tools" "build-tools;$build_tools" "ndk;$ndk" 'cmake;3.22.1'
      - name: Bouw en signeer de productie-AAB met de eigen uploadsleutel
        if: steps.existing.outputs.found == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          FABELPAD_ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
          FABELPAD_ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
          JAVA_TOOLCHAIN_17: ${{ steps.java17.outputs.path }}
        run: |
          set -euo pipefail
          umask 077
          ANDROID_UPLOAD_KEYSTORE_PATH="$(mktemp "$RUNNER_TEMP/fabelpad-upload.XXXXXXXX.p12")"
          export ANDROID_UPLOAD_KEYSTORE_PATH
          trap 'rm -f -- "$ANDROID_UPLOAD_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_UPLOAD_KEYSTORE_PATH"
          unset KEYSTORE_BASE64
          bash scripts/native-build-production.sh
      - name: Controleer exacte bron, versie, bytes en AAB-handtekening
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          python3 -B scripts/play/verify_artifact.py \
            --bundle artifacts/native/fabelpad-production.aab --report artifacts/native/fabelpad-production.json \
            --sha "$GITHUB_SHA" --package "$FABELPAD_ANDROID_PACKAGE" --name "$VERSION_NAME" --code "$VERSION_CODE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.existing.outputs.found == 'false'
        with:
          name: fabelpad-signed-aab
          path: |
            artifacts/native/fabelpad-production.aab
            artifacts/native/fabelpad-production.json
            artifacts/native/fabelpad-production-mapping.txt
          retention-days: 90
          if-no-files-found: error
      - name: Autoriseer tijdelijk bij Google Play
        if: github.event_name == 'push' && needs.play_config.outputs.play_enabled == 'true'
        id: play-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.PLAY_WIF_PROVIDER }}
          service_account: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Upload dezelfde AAB naar de geverifieerde interne track
        if: github.event_name == 'push' && needs.play_config.outputs.play_enabled == 'true'
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.play-auth.outputs.access_token }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          python3 -B scripts/play/release.py upload-internal \
            --package "$FABELPAD_ANDROID_PACKAGE" --bundle artifacts/native/fabelpad-production.aab \
            --mapping artifacts/native/fabelpad-production-mapping.txt \
            --build-report artifacts/native/fabelpad-production.json \
            --version-code "$VERSION_CODE" --tracks "$INTERNAL_TRACKS" \
            --release-name "Fabelpad $VERSION_NAME ($VERSION_CODE)" \
            --release-notes scripts/play/release-notes.json
      - name: Bewaar bewijs van de intern geaccepteerde AAB
        if: github.event_name == 'push' && needs.play_config.outputs.play_enabled == 'true'
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          bundle_sha="$(sha256sum artifacts/native/fabelpad-production.aab | cut -d ' ' -f 1)"
          jq -n --arg commit "$GITHUB_SHA" --arg package "$FABELPAD_ANDROID_PACKAGE" \
            --arg versionName "$VERSION_NAME" --argjson versionCode "$VERSION_CODE" \
            --arg bundleSha256 "$bundle_sha" --arg tracks "$INTERNAL_TRACKS" --arg runId "$GITHUB_RUN_ID" \
            '{commit:$commit,package:$package,versionName:$versionName,versionCode:$versionCode,bundleSha256:$bundleSha256,tracks:($tracks|split(",")),runId:$runId}' \
            > "$RUNNER_TEMP/fabelpad-play-receipt.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'push' && needs.play_config.outputs.play_enabled == 'true'
        with:
          name: fabelpad-play-receipt
          path: ${{ runner.temp }}/fabelpad-play-receipt.json
          retention-days: 90
          if-no-files-found: error
          overwrite: true
