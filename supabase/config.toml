# Shared local project label; hosted targets are always selected by verified ref.
project_id = "fabelpad"

[functions.auth-email]
enabled = true
verify_jwt = false # Auth calls before login; mandatory Standard Webhooks HMAC in handler.
entrypoint = "./functions/auth-email/index.ts"
import_map = "./functions/auth-email/deno.json"

[functions.email-admin]
enabled = true
verify_jwt = false # Mandatory Auth getUser + current database admin role inside handler.
entrypoint = "./functions/email-admin/index.ts"
import_map = "./functions/email-admin/deno.json"

[functions.account-maintenance]
enabled = true
verify_jwt = false # Dedicated server-generated Vault token, verified on every invocation.
entrypoint = "./functions/account-maintenance/index.ts"
import_map = "./functions/account-maintenance/deno.json"

[functions.billing]
enabled = true
verify_jwt = false # Mandatory current Auth/DB authorization; provider webhooks fetch authoritative status.
entrypoint = "./functions/billing/index.ts"
import_map = "./functions/billing/deno.json"

[functions.voorlezen-admin]
enabled = true
verify_jwt = false # Current Auth identity and private RPC authorization on each request.
entrypoint = "./functions/voorlezen-admin/index.ts"
import_map = "./functions/voorlezen-admin/deno.json"

[functions.voorlezen-worker]
enabled = true
verify_jwt = false # Dedicated staging HMAC, short validity and a one-use nonce.
entrypoint = "./functions/voorlezen-worker/index.ts"
import_map = "./functions/voorlezen-worker/deno.json"
