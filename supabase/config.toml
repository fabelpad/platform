# Shared local project label; hosted targets are always selected by verified ref.
project_id = "fabelpad"

[functions.auth-email]
enabled = true
verify_jwt = false # Auth calls before login; mandatory Standard Webhooks HMAC in handler.
entrypoint = "./functions/auth-email/index.ts"
import_map = "./functions/auth-email/deno.json"

[functions.email-admin]
enabled = true
verify_jwt = false # Mandatory Auth getUser + current database admin role inside handler.
entrypoint = "./functions/email-admin/index.ts"
import_map = "./functions/email-admin/deno.json"

[functions.account-maintenance]
enabled = true
verify_jwt = false # Dedicated server-generated Vault token, verified on every invocation.
entrypoint = "./functions/account-maintenance/index.ts"
import_map = "./functions/account-maintenance/deno.json"
